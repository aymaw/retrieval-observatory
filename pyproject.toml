[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "retrieval-observatory"
version = "0.1.0"
description = "Reproducible synthetic ML experiments with offline visual reports"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ['numpy==2.3.4', 'scikit-learn==1.7.2']

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3", "build==1.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/retrievalobs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
